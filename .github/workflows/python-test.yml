name: Python Test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  python-test:
    name: Python Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@v5
    - name: Install dependencies
      run: |
        uv sync
    - name: Ruff check
      run: |
        uv run ruff check .
    - name: Ruff format check
      run: |
        uv run ruff format --check .
    - name: Mypy
      run: |
        uv run mypy internal/akari_rpc_server/akari_rpc_server/ internal/akira_controller_server/akira_controller_server/ sdk/akari_client/akari_client sdk/akari_client/tests/ sdk/akari_proto/akari_proto/ sdk/akari_proto/tests/ tools/python
    - name: Run pytest
      run: |
        uv run pytest -v sdk/akari_client/tests
