[project]
name = "akari-software"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26.4,<2",
    "dynamixel-sdk>=3.7.31,<4",
    "akari-client[depthai]",
    "akari-proto",
    "opencv-python>=4.5.5,<5",
    "click==8.0.4",
    "pyvirtualcam>=0.9.1,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.0",
    "pytest>=7.1.2",
    "types-protobuf>=3.19.22",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "sdk/akari_client",
    "sdk/akari_proto",
]

[tool.uv.sources]
akari-client = { workspace = true }
akari-proto = { workspace = true }

# ---- ruff ----
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["internal", "sdk", "tools", "samples"]
exclude = [
    "internal/akira_services/jupyter_lab/jupyter_lab_config.py",
    "sdk/akari_proto/akari_proto/*pb2*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"setup/feetech/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["akari_client", "akari_proto", "akari_rpc_server", "akira_controller_server"]

# ---- mypy ----
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["sdk/akari_proto/akari_proto/.*pb2"]

[[tool.mypy.overrides]]
module = "akari_proto.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "dynamixel_sdk",
    "dynamixel_sdk.*",
    "serial",
    "serial.*",
    "cv2",
    "cv2.*",
    "pyvirtualcam",
    "pyvirtualcam.*",
    "depthai",
    "depthai.*",
    "blobconverter",
    "blobconverter.*",
    "matplotlib",
    "matplotlib.*",
    "feetech_servo_sdk",
    "feetech_servo_sdk.*",
    "google.protobuf",
    "google.protobuf.*",
    "grpc",
    "grpc.*",
    "fastapi",
    "fastapi.*",
    "starlette",
    "starlette.*",
    "uvicorn",
    "uvicorn.*",
    "scservo_sdk",
    "scservo_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "akira_controller_server.*",
    "akari_rpc_server.*",
    "akari_client.*",
]
disallow_untyped_decorators = false
warn_unused_ignores = false
disable_error_code = ["type-arg"]
implicit_reexport = true
