[project]
name = "akari-rpc-server"
version = "0.1.0"
description = "AKARI RPC Server"
authors = [{ name = "akari", email = "akari.tmc@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "akari-proto>=0.4.0,<0.5.0",
    "grpcio==1.68.1",
    "protobuf==5.29.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akari_rpc_server"]
